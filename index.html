<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goatface Sprite Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151a; --panel:#1a1f26; --panel-2:#222933; --line:#2e3742;
    --ink:#d6dde6; --dim:#7c8794;
    --amber:#ffb454; --amber-hot:#ffd28f;
    --ok:#69d58c; --warn:#ffb454; --err:#ff6b6b;
    --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--mono);min-height:100vh}

  /* ---- header ---- */
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;flex-wrap:wrap;
         border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;
         max-width:1280px;margin:0 auto;width:100%}
  header h1{font-family:'Silkscreen',var(--mono);font-size:15px;letter-spacing:1px;color:var(--amber)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none;
       animation:pulse 1.4s ease-in-out infinite}
  .dot.ready{background:var(--ok);animation:none}
  .dot.error{background:var(--err);animation:none}
  @keyframes pulse{50%{opacity:.35}}
  #statusText{color:var(--dim);font-size:12px}
  /* backend chip: e.g. "CUDA · RTX 3090 · 24GB" */
  #chip{margin-left:auto;font-size:11px;color:var(--dim);border:1px solid var(--line);
        border-radius:20px;padding:4px 11px;white-space:nowrap}
  #chip .b{color:var(--amber)}

  main{display:grid;grid-template-columns:320px 1fr;gap:0;min-height:calc(100vh - 57px);
       max-width:1280px;margin:0 auto}
  @media(max-width:760px){main{grid-template-columns:1fr}}

  /* ---- control panel ---- */
  .panel{border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:18px}
  @media(max-width:760px){.panel{border-right:0;border-bottom:1px solid var(--line)}}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  label .soft{text-transform:none;letter-spacing:0}
  textarea{width:100%;min-height:110px;background:var(--panel);border:1px solid var(--line);
           border-radius:6px;color:var(--ink);font:inherit;padding:10px;resize:vertical}
  textarea::placeholder{color:var(--dim)}
  textarea:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
    outline:2px solid var(--amber);outline-offset:1px}

  /* 1px gaps over a --line background draw the dividers, so the control wraps
     to a second row cleanly as options grow */
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
       border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{background:var(--panel);border:0;color:var(--dim);padding:8px 0;font:inherit;cursor:pointer}
  .seg button.wide{grid-column:span 2}
  .seg button.on{background:var(--panel-2);color:var(--amber)}

  .check{display:flex;align-items:center;gap:9px;margin:0;
         text-transform:none;letter-spacing:0;color:var(--ink)}
  .check input{width:16px;height:16px;accent-color:var(--amber);cursor:pointer}
  .check .soft{color:var(--dim)}

  .row{display:flex;align-items:center;gap:10px}
  input[type=range]{flex:1;accent-color:var(--amber)}
  .val{min-width:34px;text-align:right;color:var(--amber)}

  input[type=number],select{width:100%;background:var(--panel);border:1px solid var(--line);
                     border-radius:6px;color:var(--ink);font:inherit;padding:8px}
  input[type=number]{width:120px}

  #go{font-family:'Silkscreen',var(--mono);font-size:13px;letter-spacing:1px;padding:13px;
      background:var(--amber);color:#221a09;border:0;border-radius:6px;cursor:pointer;
      transition:background .15s}
  #go:hover:not(:disabled){background:var(--amber-hot)}
  #go:disabled{background:var(--panel-2);color:var(--dim);cursor:not-allowed}
  .hint{font-size:12px;color:var(--dim)}

  /* ---- results ---- */
  .results{padding:20px;margin:16px;border-radius:10px;background:var(--panel);
           border:1px solid var(--line);box-shadow:inset 0 0 28px rgba(0,0,0,.28)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;
        animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card .art{
    /* Aseprite-style checkerboard behind every sprite */
    background:repeating-conic-gradient(#262d36 0 25%,#1c222a 0 50%) 0 0/16px 16px;
    display:flex;justify-content:center;padding:10px}
  .card img{width:160px;height:160px;image-rendering:pixelated}
  .card .meta{display:flex;justify-content:space-between;align-items:center;
              padding:7px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
  .card a{color:var(--amber);text-decoration:none}
  .card a:hover{color:var(--amber-hot)}
  .empty{color:var(--dim);padding:60px 20px;text-align:center;line-height:1.7}
  .empty svg{display:block;width:120px;height:120px;margin:0 auto 18px}

  /* shimmering placeholder cards shown while a batch generates */
  .skel{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
        overflow:hidden;position:relative}
  .skel .art{height:180px;background:repeating-conic-gradient(#262d36 0 25%,#1c222a 0 50%) 0 0/16px 16px}
  .skel .bar{height:31px;border-top:1px solid var(--line)}
  .skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(100deg,transparent 35%,rgba(255,180,84,.12) 50%,transparent 65%);
    animation:shimmer 1.25s ease-in-out infinite}
  @keyframes shimmer{to{transform:translateX(100%)}}

  @media (prefers-reduced-motion:reduce){
    .dot{animation:none}
    .card{animation:none}
    .skel::after{animation:none}
    #go{transition:none}
  }
</style>
</head>
<body>

<header>
  <span id="dot" class="dot" aria-hidden="true"></span>
  <h1>GOATFACE SPRITE CONSOLE</h1>
  <span id="statusText" role="status" aria-live="polite">Connecting…</span>
  <span id="chip" hidden></span>
</header>

<main>
  <section class="panel" aria-label="Generation controls">
    <div>
      <label for="library">Library</label>
      <select id="library">
        <option value="">Choose a starter prompt…</option>
      </select>
    </div>

    <div>
      <label for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="rusted hull plate, sci-fi salvage prop, top-down view, oblique perspective"></textarea>
    </div>

    <div>
      <label id="gridLabel">Sprite grid</label>
      <div class="seg" id="gridSeg" role="group" aria-labelledby="gridLabel">
        <button type="button" data-v="32">32</button>
        <button type="button" data-v="64">64</button>
        <button type="button" data-v="96" class="on" aria-pressed="true">96</button>
        <button type="button" data-v="128">128</button>
        <button type="button" data-v="192">192</button>
        <button type="button" data-v="256">256</button>
        <button type="button" data-v="native" class="wide">native</button>
      </div>
      <p class="hint" style="margin-top:6px">Native skips the downscale — full 1024px, palette still applies. For hero assets and mockups.</p>
    </div>

    <div>
      <label for="colors">Palette colors</label>
      <div class="row">
        <input type="range" id="colors" min="4" max="64" value="24">
        <span class="val" id="colorsVal" aria-hidden="true">24</span>
      </div>
    </div>

    <div>
      <label for="count">Variations</label>
      <div class="row">
        <input type="range" id="count" min="1" max="8" value="4">
        <span class="val" id="countVal" aria-hidden="true">4</span>
      </div>
    </div>

    <div>
      <label for="seed">Seed <span class="soft">(blank = random)</span></label>
      <input type="number" id="seed" placeholder="random" min="0">
    </div>

    <div>
      <label class="check" for="vibrance">
        <input type="checkbox" id="vibrance">
        Vibrance <span class="soft">— richer, more saturated colors</span>
      </label>
    </div>

    <div>
      <label for="backend">GPU API</label>
      <select id="backend">
        <option value="auto">Auto (detect best)</option>
        <option value="cuda">CUDA / ROCm</option>
        <option value="cpu">CPU (slow — minutes per image)</option>
      </select>
    </div>

    <button id="go" type="button" disabled>GENERATE</button>
    <p class="hint">Sprites save to the outputs/ folder automatically. Use a card's save link to download one for Aseprite.</p>
  </section>

  <section class="results" aria-label="Results">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">
      <svg viewBox="0 0 16 16" role="img" aria-label="Crashed spaceship silhouette" shape-rendering="crispEdges">
        <!-- hull, nose down to the left -->
        <g fill="#7c8794">
          <rect x="9" y="3" width="3" height="1"/>
          <rect x="7" y="4" width="6" height="1"/>
          <rect x="5" y="5" width="8" height="1"/>
          <rect x="4" y="6" width="8" height="1"/>
          <rect x="3" y="7" width="7" height="1"/>
          <rect x="3" y="8" width="5" height="1"/>
          <rect x="12" y="2" width="1" height="2"/>
        </g>
        <!-- cockpit + spark glow -->
        <g fill="#ffb454">
          <rect x="9" y="5" width="2" height="1"/>
          <rect x="10" y="4" width="1" height="1"/>
          <rect x="2" y="9" width="1" height="1"/>
          <rect x="13" y="6" width="1" height="1"/>
        </g>
        <!-- broken ground line -->
        <g fill="#7c8794" opacity=".5">
          <rect x="1" y="11" width="3" height="1"/>
          <rect x="6" y="11" width="3" height="1"/>
          <rect x="11" y="11" width="3" height="1"/>
        </g>
      </svg>
      <p>No sprites yet.<br>Write a prompt and press generate.</p>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let grid = 96;

// ---- segmented control for grid size ----
$('gridSeg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  // "native" stays a string; every other option is a numeric grid size
  grid = btn.dataset.v === 'native' ? 'native' : +btn.dataset.v;
  [...$('gridSeg').children].forEach(b => {
    const on = b === btn;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
});

// ---- live slider readouts ----
$('colors').oninput = () => $('colorsVal').textContent = $('colors').value;
$('count').oninput  = () => $('countVal').textContent  = $('count').value;

// ---- prompt library: fill the textarea from a saved prompt ----
$('library').onchange = () => {
  const v = $('library').value;
  if (!v) return;
  $('prompt').value = v;
  $('prompt').focus();
};
async function loadLibrary() {
  try {
    const { prompts } = await (await fetch('/prompts')).json();
    for (const p of prompts) {
      const o = document.createElement('option');
      o.value = p;
      // trim long prompts to a readable label; the full text still lands in the box
      o.textContent = p.length > 48 ? p.slice(0, 47) + '…' : p;
      $('library').appendChild(o);
    }
  } catch { /* library is optional — ignore if it can't load */ }
}

// ---- render one finished sprite card (prepend = newest on top) ----
function addCard(img, prompt, atEnd) {
  const card = document.createElement('div');
  card.className = 'card';
  const alt = `pixel art sprite${prompt ? ' for prompt: ' + prompt : ''}`;
  card.innerHTML =
    `<div class="art"><img src="${img.file}" alt="${alt.replace(/"/g,'&quot;')}"></div>` +
    `<div class="meta"><span>seed ${img.seed ?? '—'}</span>` +
    `<a href="${img.file}" download>save</a></div>`;
  $('empty').style.display = 'none';
  if (atEnd) $('grid').appendChild(card); else $('grid').prepend(card);
}

// ---- restore this session's earlier sprites after a refresh ----
async function loadGallery() {
  try {
    const items = await (await fetch('/gallery')).json();
    // server sends newest first; append in order so newest ends up top-left
    for (const img of items) addCard(img, '', true);
  } catch { /* fine if outputs/ is empty */ }
}

// ---- header chip: "CUDA · RTX 3090 · 24GB", or an error state ----
function setChip(h){
  const chip = $('chip');
  chip.style.color = '';
  // no accelerator and the model gave up -> call it out in the error color
  if (h.status === 'error' && h.backend === 'CPU') {
    chip.textContent = 'no GPU backend';
    chip.style.color = 'var(--err)';
    chip.hidden = false;
    return;
  }
  if (!h.backend) { chip.hidden = true; return; }
  const bits = [`<span class="b">${h.backend}</span>`];
  if (h.device_name && h.device_name !== h.backend) bits.push(h.device_name);
  if (h.vram_gb) bits.push(`${h.vram_gb}GB`);
  chip.innerHTML = bits.join(' · ');
  chip.hidden = false;
}

// ---- poll backend until the model is warm ----
async function poll() {
  try {
    const h = await (await fetch('/health')).json();
    setChip(h);
    if (h.status === 'ready') {
      $('dot').className = 'dot ready';
      $('statusText').textContent = 'Model ready';
      $('go').disabled = false;
      return;
    }
    if (h.status === 'error') {
      // GENERATE stays off; the status line says why
      $('dot').className = 'dot error';
      $('go').disabled = true;
      $('statusText').textContent = 'Backend error — ' + (h.error || 'the model could not load') +
        '. Check the terminal running app.py, then reload this page.';
      return;
    }
    $('dot').className = 'dot';
    $('go').disabled = true;
    $('statusText').textContent = 'Waiting for model — first load downloads ~7 GB, so give it a few minutes.';
  } catch {
    $('dot').className = 'dot';
    $('go').disabled = true;
    $('statusText').textContent = 'Waiting for model — connecting to the server…';
  }
  setTimeout(poll, 3000);
}

// ---- swap compute backend — POSTs /backend, then the poller shows warm-up ----
$('backend').onchange = async () => {
  const device = $('backend').value;
  $('go').disabled = true;
  $('statusText').textContent = 'Switching backend — reloading the model…';
  try {
    await fetch('/backend', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({device})
    });
    poll();  // resume polling; status is back to loading on the server
  } catch {
    $('statusText').textContent = 'Could not reach the server. Is app.py still running?';
  }
};

// ---- generate ----
async function generate() {
  if ($('go').disabled) return;
  const prompt = $('prompt').value.trim();
  if (!prompt) { $('prompt').focus(); $('statusText').textContent = 'Add a prompt first, then generate.'; return; }

  const n = +$('count').value;
  $('go').disabled = true;
  $('go').textContent = 'GENERATING…';

  // one shimmering placeholder per requested variation
  $('empty').style.display = 'none';
  const skels = [];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'skel';
    s.innerHTML = '<div class="art"></div><div class="bar"></div>';
    $('grid').prepend(s);
    skels.push(s);
  }

  // tick elapsed seconds in the status line
  let secs = 0;
  const label = `Generating ${n} sprite${n > 1 ? 's' : ''}`;
  $('statusText').textContent = `${label}… (0s)`;
  const ticker = setInterval(() => { $('statusText').textContent = `${label}… (${++secs}s)`; }, 1000);

  try {
    const body = {
      prompt, grid,
      colors: +$('colors').value,
      count:  n,
      seed:   $('seed').value ? +$('seed').value : null,
      vibrance: $('vibrance').checked
    };
    const r = await fetch('/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (!r.ok || data.error) throw new Error(data.error || `server returned ${r.status}`);

    // /generate returns a bare array: [{file, seed}, ...]
    skels.forEach(s => s.remove());
    for (const img of data) addCard(img, prompt, false);
    $('statusText').textContent = `Model ready — generated ${data.length} sprite${data.length > 1 ? 's' : ''} in ${secs}s`;
  } catch (err) {
    skels.forEach(s => s.remove());
    if (!$('grid').children.length) $('empty').style.display = '';
    $('statusText').textContent = 'Generation failed — ' + err.message + '. Try again in a moment.';
  } finally {
    clearInterval(ticker);
    $('go').disabled = false;
    $('go').textContent = 'GENERATE';
  }
}

$('go').onclick = generate;

// Ctrl+Enter (or Cmd+Enter) inside the prompt box fires generate
$('prompt').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); generate(); }
});

// ---- boot ----
loadLibrary();
loadGallery();
poll();
</script>
</body>
</html>
